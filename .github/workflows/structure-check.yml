# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# The one real workflow for a design repo: the docs that ARE the repo exist,
# the README stays honest, and the prune doesn't regress (ADR 0008 in
# groove-protocol). Everything else in this directory is scheduled for
# deletion per the prune targets asserted in tests/validate_structure.sh
# (at most one AI manifest, at most five workflows).
name: structure-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash tests/validate_structure.sh
